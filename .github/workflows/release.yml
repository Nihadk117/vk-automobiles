name: Windows release package
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:auth
      - run: npm run test:ui
      - run: npm run test:watch-shop
        env:
          SHOP_QA_HEADLESS: '1'
          SHOP_QA_SLOW_MS: '0'
          SHOP_QA_RUN: release-acceptance
      - run: npm run test:launcher
      - run: npm run package:windows
      - uses: actions/upload-artifact@v4
        with:
          name: VK-Automobiles-Windows
          path: release/*.zip
          retention-days: 14
